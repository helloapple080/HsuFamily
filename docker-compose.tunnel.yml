services:
  backend:
    environment:
      AllowedHosts: ${PORTAL_DOMAIN:?PORTAL_DOMAIN is required}
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl --silent --output /dev/null --write-out '%{http_code}' --header \"Host: $$AllowedHosts\" --header 'X-Forwarded-Proto: https' http://127.0.0.1:5001/health/ready)\" = 200"]

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_URL: ""

  caddy:
    ports: !reset []
    environment:
      TUNNEL_CONNECTOR_IP: ${TUNNEL_CONNECTOR_IP:-172.29.53.3}
    volumes:
      - ./deploy/Caddyfile.tunnel:/etc/caddy/Caddyfile:ro
    networks:
      tunnel-edge: {}

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    restart: unless-stopped
    depends_on:
      - caddy
    networks:
      tunnel-edge:
        ipv4_address: ${TUNNEL_CONNECTOR_IP:-172.29.53.3}

networks:
  tunnel-edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${TUNNEL_EDGE_SUBNET:-172.29.53.0/24}
