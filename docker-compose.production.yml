services:
  # ─── MongoDB ───────────────────────────────────────────
  mongodb:
    image: mongo:7.0.23
    container_name: family-portal-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: familyportal_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: FamilyPortal
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./backend/scripts/mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    networks:
      - family-portal-network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username familyportal_root --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongodb-user-init:
    image: mongo:7.0.23
    restart: "no"
    environment:
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - ./backend/scripts/ensure-app-user.js:/scripts/ensure-app-user.js:ro
    command: ["sh", "-c", "exec mongosh --host mongodb --port 27017 --username familyportal_root --password \"$$MONGO_ROOT_PASSWORD\" --authenticationDatabase admin --file /scripts/ensure-app-user.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - family-portal-network

  # ─── Backend API ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: family-portal-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5001
      MongoDbSettings__ConnectionString: mongodb://familyportal_app:${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}@mongodb:27017/FamilyPortal?authSource=FamilyPortal
      MongoDbSettings__DatabaseName: FamilyPortal
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JwtSettings__Issuer: FamilyPortal
      JwtSettings__Audience: FamilyPortalApp
      JwtSettings__AccessTokenExpirationMinutes: 30
      JwtSettings__RefreshTokenExpirationDays: 7
      DefaultAdmin__Username: ${ADMIN_USERNAME:-admin}
      DefaultAdmin__Email: ${ADMIN_EMAIL:-admin@family.portal}
      DefaultAdmin__DisplayName: ${ADMIN_DISPLAY_NAME:-許浴宸}
      DefaultAdmin__Password: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      SecuritySettings__CookieSecure: "true"
      AllowedOrigins__0: https://${PORTAL_DOMAIN:?PORTAL_DOMAIN is required}
      ProxySettings__KnownProxies__0: ${CADDY_PROXY_IP:?CADDY_PROXY_IP is required}
      DataProtection__KeysPath: /app/keys
      AllowedHosts: ${API_DOMAIN:?API_DOMAIN is required}
    volumes:
      - data_protection_keys:/app/keys
    expose:
      - "5001"
    depends_on:
      mongodb-user-init:
        condition: service_completed_successfully
    networks:
      - family-portal-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Frontend ───────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}
    container_name: family-portal-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - family-portal-network

  # ─── TLS Edge ───────────────────────────────────────────
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:?PORTAL_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      family-portal-network:
        ipv4_address: ${CADDY_PROXY_IP:?CADDY_PROXY_IP is required}

networks:
  family-portal-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${FAMILY_PORTAL_SUBNET:-172.20.0.0/24}

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  data_protection_keys:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
